spring.application.name=impact-backend
server.address=127.0.0.1
server.port=8080
# Optional local settings are ignored by Git. Environment variables also work.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/e-commerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:impact-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Repeatable classroom scripts create missing tables before JPA validation.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/create_tables.sql
spring.sql.init.data-locations=classpath:database/insert_data.sql
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
