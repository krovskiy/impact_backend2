spring.application.name=impact-backend
server.address=127.0.0.1
server.port=8080
# Lesson 2 classroom setup: embedded H2, no database server or password setup.
# Deliberately do not import old application-local.properties (PostgreSQL/Redis settings).
spring.datasource.url=jdbc:h2:mem:impact;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/create_tables.sql
spring.sql.init.data-locations=classpath:database/insert_data.sql
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Lesson 3: the same cache annotations work locally without Redis/Memurai.
spring.cache.type=simple
spring.cache.cache-names=products,categories
# Optional Redis exercise: explicitly pass --spring.cache.type=redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
springdoc.override-with-generic-response=false
